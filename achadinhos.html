<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mariana Ambrosio | Favoritos & Achadinhos</title>
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Estilos da Vitrine -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="app-wrapper">
    
    <!-- Cabeçalho e Perfil -->
    <header class="header-profile">
      <div class="avatar-wrapper">
        <img src="./perfil.jpg" alt="Mariana Ambrosio" onerror="this.src='WhatsApp Image 2026-08-31 at 17.36.17.jpeg'">
        <span class="avatar-badge" title="Verificada"><i class="fa-solid fa-check"></i></span>
      </div>
      <h1 class="profile-name">Mariana Ambrosio</h1>
      <p class="profile-subtitle">✨ Meus Achadinhos & Favoritos ✨</p>
      
      <!-- Redes Sociais & Link do Curso -->
      <div class="social-links">
        <a href="./index.html" class="social-btn" style="background: #242220; color: #fff; border-color: #242220;">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>Fórmula do Plano B</span>
        </a>
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-btn">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
        </a>
        <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" class="social-btn">
          <i class="fa-brands fa-tiktok"></i>
          <span>TikTok</span>
        </a>
      </div>
    </header>

    <!-- Barra de Pesquisa Rápida -->
    <div class="search-container">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Digite o número ou nome do achadinho..." autocomplete="off">
        <button type="button" class="search-clear-btn" id="searchClearBtn" aria-label="Limpar pesquisa">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button type="button" class="search-btn" aria-label="Pesquisar">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <!-- Filtros de Categoria -->
    <nav class="categories-scroll" aria-label="Filtro de categorias">
      <div class="categories-list" id="categoriesList">
        <!-- Preenchido dinamicamente via JS -->
      </div>
    </nav>

    <!-- Barra de Contagem de Resultados -->
    <div class="results-info">
      <span id="resultsCount">Carregando achadinhos...</span>
    </div>

    <!-- Grade de Achadinhos -->
    <main class="products-grid" id="productsGrid">
      <!-- Inserido dinamicamente via JS -->
    </main>

    <!-- Rodapé -->
    <footer class="footer-section">
      <div class="footer-badge">
        <i class="fa-solid fa-lock"></i>
        <span>marianaambrosio.com.br</span>
      </div>
      <a href="admin.html" class="footer-admin-link">
        <i class="fa-solid fa-gear"></i>
        <span>Gerenciar Achadinhos (Admin)</span>
      </a>
    </footer>

  </div>

  <!-- Toast Notificação -->
  <div id="toastMsg" class="toast-msg"></div>

  <!-- Script Principal -->
  <script src="./app.js"></script>
</body>
</html>
